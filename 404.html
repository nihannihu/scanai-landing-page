<!DOCTYPE html>

  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <script>
    // Seamless routing for /verify/:id on static web hosts
    (function() {
      var pathname = window.location.pathname;
      var match = pathname.match(/\/verify\/([A-Za-z0-9_-]+)/i);
      if (match && match[1] && match[1].toLowerCase() !== 'index.html') {
        window.location.replace('/verify/?id=' + encodeURIComponent(match[1]));
      }
    })();
  </script>
</head>
